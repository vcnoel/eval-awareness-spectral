[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-awareness-spectral"
version = "0.2.0"
description = "Causal research protocol for evaluation cues, internal recognition, and behavioral propensity"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Valentin Noël" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4", "pandas>=2.1,<3"]
legacy = ["pandas>=2.1,<3", "spectral-trust==0.2.2", "tqdm>=4.66,<5"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
eval-awareness-spectral = "eval_awareness_spectral.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eval_awareness_spectral = ["resources/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["eval_awareness_spectral"]
omit = [
  "src/eval_awareness_spectral/activations.py",
  "src/eval_awareness_spectral/analysis.py",
  "src/eval_awareness_spectral/baselines.py",
  "src/eval_awareness_spectral/decomposition.py",
  "src/eval_awareness_spectral/freq_decomp.py",
  "src/eval_awareness_spectral/generation.py",
  "src/eval_awareness_spectral/law_mining.py",
  "src/eval_awareness_spectral/legacy_cli.py",
  "src/eval_awareness_spectral/metric_study.py",
  "src/eval_awareness_spectral/plots.py",
  "src/eval_awareness_spectral/prompts.py",
  "src/eval_awareness_spectral/runner.py",
  "src/eval_awareness_spectral/sandbagging.py",
  "src/eval_awareness_spectral/separability.py",
  "src/eval_awareness_spectral/spans.py",
  "src/eval_awareness_spectral/spectral_transfer.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B018"]
"src/eval_awareness_spectral/{activations,analysis,baselines,decomposition,freq_decomp,generation,law_mining,legacy_cli,metric_study,plots,prompts,runner,sandbagging,separability,spans,spectral_transfer}.py" = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
"scripts/**/*.py" = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["eval_awareness_spectral"]
exclude = [
  "src/eval_awareness_spectral/(activations|analysis|baselines|decomposition|freq_decomp|generation|law_mining|legacy_cli|metric_study|plots|prompts|runner|sandbagging|separability|spans|spectral_transfer)\\.py",
]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.uv]
default-groups = []
